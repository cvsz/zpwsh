name: windows-installer

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable Pester)) {
            Install-Module Pester -Scope CurrentUser -Force -AllowClobber
          }

      - name: Run module tests
        shell: pwsh
        run: |
          Import-Module Pester -Force
          Invoke-Pester ./tests/zpwsh.Tests.ps1 -PassThru | Out-Null

      - name: Run installer smoke tests
        shell: pwsh
        run: |
          Import-Module Pester -Force
          Invoke-Pester ./tests/windows-installer.Tests.ps1 -PassThru | Out-Null

      - name: Build Windows installer package
        shell: pwsh
        run: |
          & ./windows/Build-ZpwshInstaller.ps1 -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zpwsh-windows-installer
          path: dist/zpwsh-windows-installer-*.zip
